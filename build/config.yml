# Wails project configuration.
# After changing `info`, run `wails3 task common:update:build-assets` to regenerate the
# platform build assets (this overwrites manual changes to those assets).
version: '3'

info:
  companyName: "Qryvanta contributors"
  productName: "Qryvanta"
  productIdentifier: "io.qryvanta.desktop"
  description: "Desktop SQL execution debugging platform"
  copyright: "Copyright 2026 Qryvanta contributors. Licensed under Apache-2.0."
  comments: "https://github.com/TuanFaied/qryvanta"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - docs
      - tests
      - sidecar
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
  - name: Qryvanta
