version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: ["type: chore", "area: deps"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: ["type: chore", "area: deps"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node must match the Node.js major that runs the build (CI: Node 22). A newer
      # major types APIs that do not exist at runtime; move both together, deliberately.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directory: /sidecar
    schedule:
      interval: weekly
    labels: ["type: chore", "area: deps"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["type: chore", "area: ci"]
    commit-message:
      prefix: "ci"
