name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal tests tools frontend/embed.go)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -count=1 ./...

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vite build

  sidecar:
    name: Parser sidecar (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test sidecar/Sidecar.slnx
      - name: Publish the single-file build and smoke-test it
        shell: bash
        run: |
          dotnet publish sidecar/tsqlparser -c Release -r win-x64 -o publish
          ls -l publish
          ./publish/qryvanta-tsqlparser.exe --version
          printf '%s\n' '{"id":"1","op":"parse","sql":"SELECT 1\nGO\nSELECT FROM"}' | ./publish/qryvanta-tsqlparser.exe | tee out.jsonl
          grep -q '"line":3' out.jsonl
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Go client against the published sidecar
        shell: bash
        run: QRYVANTA_PARSER_PATH="$PWD/publish/qryvanta-tsqlparser.exe" go test -tags parser -count=1 -v ./internal/parser/...

  desktop:
    name: Desktop build (Wails)
    runs-on: windows-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # wails3 build also builds the parser sidecar.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Build desktop app and CLI
        shell: bash
        run: |
          wails3 build
          wails3 task build:cli
          ./bin/qryvanta-cli.exe version
          ./bin/qryvanta-tsqlparser.exe --version
      - name: Bindings are up to date
        shell: bash
        run: git diff --exit-code -- frontend/bindings

  integration:
    name: Integration (SQL Server)
    # Linux runners can run the SQL Server container; the Windows runners cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Linux has a C compiler for the race detector; the parser client is concurrency-heavy.
      - name: Parser client under the race detector
        run: go test -race -count=3 ./internal/parser/...
      - name: Start SQL Server and load the fixture database
        run: docker compose run --rm fixtures
      - name: Integration tests (read-only login)
        env:
          QRYVANTA_TEST_MSSQL_SERVER: localhost
          QRYVANTA_TEST_MSSQL_PORT: "14333"
          QRYVANTA_TEST_MSSQL_USER: qryvanta_reader
          QRYVANTA_TEST_MSSQL_PASSWORD: Sample_R3adOnly!
          # Used only by the write-access test that checks sysadmin is reported as can_write.
          QRYVANTA_TEST_MSSQL_ADMIN_PASSWORD: Qryvanta_Dev_2026!
          QRYVANTA_TEST_MSSQL_TRUST: "true"
        run: go test -tags integration -count=1 -v ./internal/dialect/mssql/ ./tests/integration/ ./cmd/qryvanta-cli/
      - name: SQL Server logs
        if: failure()
        run: docker compose logs sqlserver
      - name: Stop SQL Server
        if: always()
        run: docker compose down -v
