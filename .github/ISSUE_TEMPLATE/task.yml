name: Task
description: A planned unit of work from the roadmap (used mainly by maintainers).
title: "task: "
labels: ["type: task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task delivers and why.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] Tests cover ...
        - [ ] Docs updated
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Roadmap phase
      placeholder: Phase 2
