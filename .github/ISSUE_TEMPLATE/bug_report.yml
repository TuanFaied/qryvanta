name: Bug report
description: Something in Qryvanta does not work as documented.
title: "bug: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not paste passwords, connection strings, or production data.**
        For security vulnerabilities, use [a private report](https://github.com/TuanFaied/qryvanta/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open settings
        2. Set the query timeout to 0
        3. Click Save
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: SQL query (if relevant)
      description: A minimal query and schema that reproduce the problem. Remove sensitive names and values.
      render: sql
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app (UI)
        - CLI
        - Connections
        - Query execution
        - Parser
        - Diagnostics
        - Execution plans
        - Reports and history
        - Build / installer
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Qryvanta version
      description: Shown in the app header, or run `qryvanta-cli version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: sqlserver
    attributes:
      label: SQL Server version (if relevant)
      placeholder: SQL Server 2022 CU15 / Azure SQL Database
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `%LocalAppData%\Qryvanta\logs\qryvanta.log`. Passwords are masked automatically, but please check before posting.
      render: text
